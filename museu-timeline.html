<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P9ZCGD46H8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P9ZCGD46H8');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline — Museu Leça FC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="images/leca.png" />
  <link rel="stylesheet" href="design-system.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #050e0b;
      color: #f0f0f0;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* ── Hero ── */
    #hero {
      position: relative;
      height: 100vh;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('images/museum/timeline/01_fundacao_jornais.png');
      background-size: cover;
      background-position: center top;
      transform: scale(1.08);
      filter: blur(2px) grayscale(30%);
      opacity: 0.22;
      will-change: transform;
    }
    #hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #011713 0%, #022e26 40%, #034638 100%);
      opacity: 0.82;
    }
    #hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 1.5rem;
    }
    #hero-content img { filter: drop-shadow(0 8px 24px rgba(0,0,0,0.7)); }
    #hero-content h1 {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
      margin: 1.2rem 0 0.5rem;
      line-height: 1;
    }
    #hero-content p {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: rgba(255,255,255,0.72);
      max-width: 560px;
      margin: 0 auto;
    }
    .scroll-indicator {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: rgba(255,255,255,0.45);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    /* ── Sticky Nav ── */
    #timeline-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(2, 20, 14, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(5,107,87,0.3);
      overflow-x: auto;
      scrollbar-width: none;
    }
    #timeline-nav::-webkit-scrollbar { display: none; }
    #timeline-nav .nav-inner {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.75rem 1.25rem;
      min-width: max-content;
      max-width: 1200px;
      margin: 0 auto;
    }
    .nav-btn {
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.55);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      text-decoration: none;
    }
    .nav-btn:hover {
      color: #fff;
      background: rgba(5,107,87,0.35);
      border-color: rgba(5,107,87,0.5);
    }
    .nav-btn.active {
      color: #fff;
      background: #056b57;
      border-color: #056b57;
    }
    .nav-back {
      color: rgba(255,255,255,0.45);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.2s;
      margin-right: 0.75rem;
      white-space: nowrap;
    }
    .nav-back:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.06);
    }
    .nav-divider {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.12);
      margin: 0 0.5rem;
      flex-shrink: 0;
    }

    /* ── Timeline blocks ── */
    .timeline-block {
      padding: 6rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .block-period {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 1rem;
      border-radius: 9999px;
      background: rgba(5,107,87,0.2);
      border: 1px solid rgba(5,107,87,0.4);
      color: #5ecfb1;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .block-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5rem;
      align-items: center;
    }
    .block-grid.reverse { direction: rtl; }
    .block-grid.reverse > * { direction: ltr; }
    @media (max-width: 768px) {
      .block-grid, .block-grid.reverse { grid-template-columns: 1fr; direction: ltr; }
    }

    .hero-img-wrap {
      position: relative;
      border-radius: 1.25rem;
      overflow: hidden;
      background: #0a1f18;
      aspect-ratio: 4/3;
      cursor: pointer;
    }
    .hero-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .hero-img-wrap:hover img { transform: scale(1.04); }
    .hero-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.35) 0%, transparent 50%);
      pointer-events: none;
    }
    .img-zoom-hint {
      position: absolute;
      bottom: 0.75rem;
      right: 0.75rem;
      z-index: 5;
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.7);
      border-radius: 9999px;
      padding: 0.25rem 0.6rem;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .hero-img-wrap:hover .img-zoom-hint { opacity: 1; }

    .block-content h2 {
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.2rem;
    }
    .block-content p {
      color: rgba(255,255,255,0.65);
      line-height: 1.8;
      font-size: 0.97rem;
    }

    .highlight-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.75rem;
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      background: rgba(5,107,87,0.12);
      border: 1px solid rgba(5,107,87,0.25);
    }
    .highlight-card img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(5,107,87,0.5);
      flex-shrink: 0;
    }
    .highlight-card p {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.6);
      margin: 0;
      line-height: 1.5;
    }
    .highlight-card strong { color: #5ecfb1; font-weight: 700; }

    /* Mini timeline (block 8) */
    .mini-timeline {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .mini-tl-item {
      display: flex;
      align-items: stretch;
      gap: 1rem;
    }
    .mini-tl-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 16px;
      flex-shrink: 0;
    }
    .mini-tl-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #056b57;
      border: 2px solid #5ecfb1;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .mini-tl-item:last-child .mini-tl-dot { border-color: #fff; background: #fff; }
    .mini-tl-line {
      width: 1px;
      flex: 1;
      background: rgba(5,107,87,0.35);
      margin: 2px 0;
    }
    .mini-tl-item:last-child .mini-tl-line { display: none; }
    .mini-tl-content {
      padding-bottom: 1rem;
    }
    .mini-tl-content .year {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #5ecfb1;
      text-transform: uppercase;
    }
    .mini-tl-content .label {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.4;
    }
    .mini-tl-item:last-child .mini-tl-content .label { color: #fff; font-weight: 600; }

    /* Gallery grid */
    /* Founder spotlight */
    .founder-spotlight {
      margin-top: 2.5rem;
      padding: 1.5rem;
      border-radius: 1.25rem;
      background: rgba(5,107,87,0.08);
      border: 1px solid rgba(5,107,87,0.2);
    }
    .founder-spotlight-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .founder-spotlight-header .fs-eyebrow {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5ecfb1;
    }
    .founder-spotlight-header .fs-divider {
      flex: 1;
      height: 1px;
      background: rgba(5,107,87,0.25);
    }
    .founder-spotlight-body {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
    }
    .founder-spotlight-photo {
      width: 90px;
      height: 110px;
      border-radius: 0.75rem;
      object-fit: cover;
      object-position: top;
      border: 1px solid rgba(5,107,87,0.4);
      flex-shrink: 0;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .founder-spotlight-photo:hover { border-color: #5ecfb1; }
    .founder-spotlight-info { flex: 1; }
    .founder-spotlight-info h3 {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.35rem;
      line-height: 1.2;
    }
    .founder-spotlight-info .fs-role {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #5ecfb1;
      margin-bottom: 0.6rem;
    }
    .founder-spotlight-info p {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
      margin: 0;
    }
    .founder-gallery {
      margin-top: 1.1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .founder-gallery .gallery-thumb {
      width: 80px;
      height: 60px;
      border-radius: 0.5rem;
      flex-shrink: 0;
    }
    @media (max-width: 480px) {
      .founder-spotlight-body { flex-direction: column; }
      .founder-spotlight-photo { width: 100%; height: 160px; }
    }

    .gallery-section {
      margin-top: 3rem;
    }
    .gallery-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 1rem;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .gallery-thumb {
      aspect-ratio: 4/3;
      border-radius: 0.75rem;
      overflow: hidden;
      background: #0a1f18;
      cursor: pointer;
      position: relative;
    }
    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, filter 0.3s;
      filter: brightness(0.85);
    }
    .gallery-thumb:hover img {
      transform: scale(1.08);
      filter: brightness(1);
    }
    .gallery-thumb::after {
      content: '\f00e';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: rgba(255,255,255,0.0);
      background: rgba(0,0,0,0);
      transition: all 0.3s;
    }
    .gallery-thumb:hover::after {
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.3);
    }

    /* Block separator */
    .block-sep {
      max-width: 1200px;
      margin: 0 auto;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(5,107,87,0.25), transparent);
    }

    /* Fade-in animation */
    .fade-in {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .fade-in.delay-1 { transition-delay: 0.15s; }
    .fade-in.delay-2 { transition-delay: 0.3s; }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #lightbox.open { display: flex; }
    #lb-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      color: rgba(255,255,255,0.6);
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 1001;
      transition: color 0.2s;
      background: none;
      border: none;
      line-height: 1;
    }
    #lb-close:hover { color: #fff; }
    #lb-prev, #lb-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1001;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    #lb-prev { left: 1rem; }
    #lb-next { right: 1rem; }
    #lb-prev:hover, #lb-next:hover {
      background: rgba(5,107,87,0.5);
      color: #fff;
      border-color: #056b57;
    }
    @media (max-width: 640px) {
      #lb-prev { left: 0.4rem; }
      #lb-next { right: 0.4rem; }
    }

    /* Footer */
    .timeline-footer {
      padding: 3rem 1.5rem 4rem;
      text-align: center;
      border-top: 1px solid rgba(5,107,87,0.18);
    }
  </style>
</head>
<body data-design-mode="immersive">

  <!-- ── Hero ── -->
  <section id="hero">
    <div id="hero-bg"></div>
    <div id="hero-overlay"></div>
    <div id="hero-content">
      <a href="museu.html">
        <img src="images/leca.png" alt="Leça FC" width="80" height="80" />
      </a>
      <h1>Museu Digital<br>Leça FC</h1>
      <p>Uma viagem pela história verde e branca</p>
      <div class="scroll-indicator">
        <i class="fa-solid fa-chevron-down"></i>
        <span>Scroll</span>
      </div>
    </div>
  </section>

  <!-- ── Sticky Navigation ── -->
  <nav id="timeline-nav" aria-label="Navegar na timeline">
    <div class="nav-inner">
      <a href="museu.html" class="nav-back"><i class="fa-solid fa-arrow-left"></i> Museu</a>
      <div class="nav-divider"></div>
      <span id="nav-items"></span>
    </div>
  </nav>

  <!-- ── Timeline (renderizado por museu-timeline.js) ── -->
  <main id="timeline-container"></main>

  <!-- ── Footer ── -->
  <div class="timeline-footer">
    <p style="color:rgba(255,255,255,0.35); font-size:0.8rem; margin-bottom:1.5rem; letter-spacing:0.06em; text-transform:uppercase;">Fim da Timeline</p>
    <a href="museu.html" style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.75rem 1.75rem; background:#056b57; color:#fff; font-weight:700; border-radius:9999px; text-decoration:none; font-size:0.9rem; transition:background 0.2s;" onmouseover="this.style.background='#034638'" onmouseout="this.style.background='#056b57'">
      <i class="fa-solid fa-arrow-left"></i> Voltar ao Museu
    </a>
    <p style="color:rgba(255,255,255,0.2); font-size:0.75rem; margin-top:2.5rem;">© <span id="year"></span> Leça Futebol Clube</p>
  </div>

  <!-- ── Lightbox ── -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizar imagem">
    <button id="lb-close" onclick="closeLightbox()" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
    <button id="lb-prev" onclick="lbNav(-1)" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button>
    <div id="lb-content">
      <img id="lb-img" src="" alt="" />
      <p id="lb-caption"></p>
    </div>
    <button id="lb-next" onclick="lbNav(1)" aria-label="Próxima"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <style>
    #lb-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      max-width: min(90vw, 1100px);
    }
    #lb-content img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 0.75rem;
      box-shadow: 0 0 80px rgba(0,0,0,0.8);
    }
    #lb-caption {
      color: rgba(255,255,255,0.65);
      font-size: 0.82rem;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      line-height: 1.5;
      margin: 0;
      min-height: 1em;
      max-width: 640px;
      padding: 0 1rem;
    }
  </style>

  <script src="museu-timeline-data.js"></script>
  <script src="museu-timeline.js"></script>
</body>
</html>
