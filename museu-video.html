<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P9ZCGD46H8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P9ZCGD46H8');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vídeo Museu - Universo Leça FC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: {
              50: '#e6f2f0',
              100: '#cce5e1',
              200: '#99cbc3',
              300: '#66b1a5',
              400: '#339787',
              500: '#056b57',
              600: '#045a4a',
              700: '#034638',
              800: '#022e26',
              900: '#011713'
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="images/leca.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="design-system.css" />
</head>
<body data-design-mode="immersive" data-page="museum-video">
  <div class="min-h-screen flex flex-col px-4 py-12">
    <a href="museu.html" class="mb-6 text-center">
      <img src="images/leca.png" alt="Leça FC" class="w-24 h-24 md:w-32 md:h-32 mx-auto" />
    </a>

    <h1 class="text-4xl md:text-6xl lg:text-7xl font-black text-white text-center mb-4 tracking-tight">
      MUSEU EM VÍDEO
    </h1>

    <p id="intro-text" class="text-lg md:text-xl text-white/90 text-center mb-10 max-w-3xl mx-auto">
      A carregar conteúdo do momento histórico...
    </p>

    <div class="max-w-5xl w-full mx-auto">
      <div class="card p-8 rounded-2xl">
        <div class="flex items-center gap-3 mb-3">
          <i class="fa-solid fa-film text-3xl text-emerald-700"></i>
          <h2 id="video-title" class="text-2xl md:text-3xl font-black text-gray-900">Momento Histórico</h2>
        </div>
        <p id="video-description" class="text-gray-700 mb-6 leading-relaxed"></p>

        <div class="relative w-full rounded-xl overflow-hidden bg-gray-100">
          <video
            id="video-frame"
            class="w-full rounded-xl"
            controls
            preload="metadata"
            src=""
          >
            O teu navegador não suporta a reprodução de vídeo.
          </video>
        </div>

        <p id="video-note" class="text-xs text-gray-500 mt-4"></p>
      </div>
    </div>

    <div class="text-center mt-12 flex flex-col sm:flex-row justify-center gap-3">
      <a href="museu.html" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-white text-emerald-700 font-bold rounded-full shadow-lg hover:shadow-xl transition-all hover:scale-105">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar ao museu
      </a>
      <a href="index.html" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-white/20 text-white font-bold rounded-full hover:bg-white/30 transition-all">
        <i class="fa-solid fa-house"></i>
        Ir para o início
      </a>
    </div>

    <footer class="text-center text-white/70 text-sm mt-12">
      <p class="mb-2">Vive a paixão do Leça FC.</p>
      <p class="mb-4">Contacta: <a href="mailto:geral@lecafc.pt" class="text-white underline hover:text-white/90">geral@lecafc.pt</a></p>
      <p>© <span id="year"></span> Leça Futebol Clube - Museu.</p>
    </footer>
  </div>

  <script src="museu-video.js"></script>
</body>
</html>
