services:
  web:
    image: node:22-alpine
    container_name: site-lfc-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "8081:8081"
    environment:
      VITE_API_PROXY_TARGET: http://host.docker.internal:5004
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
